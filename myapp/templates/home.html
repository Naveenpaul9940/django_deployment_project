<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        {% for i in products %}
        <div class="product">
            <img src="{{i.image.url}}" alt="">
            <h2>{{i.name}}</h2>
            <p>{{i.price}}</p>
            <button>ADD TO CART</button>
            <button>BUY NOW</button>
        </div>
        {% endfor %}
    </div>
</body>
</html>
